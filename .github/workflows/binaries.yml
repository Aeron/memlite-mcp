name: Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (must match Cargo.toml)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.4"
  RUST_BACKTRACE: short

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate tag and package version
        run: python3 .github/scripts/release.py "$RELEASE_TAG"
      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft \
            | jq --exit-status '.isDraft == false'

  build-and-upload:
    name: Build and upload (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test and smoke-test release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo test --locked --target "$TARGET"
          cargo build --release --locked --target "$TARGET"
          "target/$TARGET/release/memlite" --version
      - name: Upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: memlite
          target: ${{ matrix.target }}
          build-tool: cargo
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/${{ env.RELEASE_TAG }}

  publish-crate:
    name: Publish Cargo package
    needs: [prepare, build-and-upload]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Check whether crate version is already published
        id: crate
        run: python3 .github/scripts/release.py "$RELEASE_TAG" --check-published >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.crate.outputs.published == 'false'
      - uses: Swatinem/rust-cache@v2
        if: steps.crate.outputs.published == 'false'
      - name: Publish to crates.io
        if: steps.crate.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Keep existing crate version
        if: steps.crate.outputs.published == 'true'
        run: echo "Crate version $RELEASE_TAG is already published; skipping Cargo publication."
