[package]
name = "memlite-mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "memlite-mcp"
path = "src/main.rs"

[dependencies]
# MCP server: official Rust SDK with stdio transport and tool macros
rmcp = { version = "1.6.0", features = ["server", "transport-io", "macros", "schemars"] }

# Database: libsql (SQLite fork) with built-in vector functions
libsql = { version = "0.9.30", default-features = false, features = ["core"] }

# Embeddings: local ONNX inference (BAAI/bge-small-en-v1.5, 384 dims)
fastembed = "5.13.4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Error handling
anyhow = "1"

# Utilities
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Performance: faster global memory allocator
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
