[package]
name = "memlite-mcp"
version = "0.1.0"
edition = "2024"
authors = ["Eugene \"Aeron\" Glybin"]
description = "Persistent memory MCP server for AI agents using local SQLite storage and ONNX embeddings."
categories = ["command-line-utilities", "development-tools"]
keywords = ["mcp", "memory", "agent", "embeddings", "sqlite"]
license = "Zlib"
readme = "README.md"
repository = "https://github.com/Aeron/memlite-mcp"
include = ["/src/**/*", "/docs/**/*.md", "/LICENSE", "/README.md"]

[dependencies]
# MCP server: official Rust SDK with stdio transport and tool macros
rmcp = { version = "1.6.0", features = ["server", "transport-io", "macros", "schemars"] }

# Database: libsql (SQLite fork) with built-in vector functions
libsql = { version = "0.9.30", default-features = false, features = ["core"] }

# Embeddings: local ONNX inference (BAAI/bge-small-en-v1.5, 384 dims)
fastembed = "5.13.4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Error handling
anyhow = "1"

# Enum string conversion
strum = { version = "0.27", features = ["derive"] }

# Utilities
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Performance: faster global memory allocator
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "memlite-mcp"
path = "src/main.rs"

[profile.bench]
inherits = "release"
# Keeping debug info and symbols for profiling the bench runner;
# does not affect the spawned binary's runtime performance
strip = false
debug = 1

[[bench]]
name = "mcp_tools"
harness = false
